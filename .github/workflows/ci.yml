name: CI

on:
  push:
    branches:
      - dev
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify contributor license agreement
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" \
            | grep -Eiq '^- \[[xX]\] I have read and agree to the \[Fast Lane Contributor License Agreement\]'; then
            echo "The pull request author must accept the Fast Lane Contributor License Agreement."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run lint and unit tests
        run: make lint

      - name: Enforce runtime coverage gate
        run: make coverage-runtime

      - name: Scan known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
